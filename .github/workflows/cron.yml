name: cron

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  refresh-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      NODE_ENV: production
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
      MODETOUR_API_KEY: ${{ secrets.MODETOUR_API_KEY }}
      MODETOUR_WEBSITE_NO: ${{ secrets.MODETOUR_WEBSITE_NO }}
      MODETOUR_COMPANY_NO: ${{ secrets.MODETOUR_COMPANY_NO }}
      MODETOUR_DEVICE_TYPE: ${{ secrets.MODETOUR_DEVICE_TYPE }}
      PRODUCT_MASTER_SCRAPE_MONTHS: ${{ vars.PRODUCT_MASTER_SCRAPE_MONTHS }}
      EP_OVERRIDE_SHEET_URL: ${{ secrets.EP_OVERRIDE_SHEET_URL }}
      EP_MAX_ITEMS: ${{ vars.EP_MAX_ITEMS }}
      EP_FILENAME: ${{ vars.EP_FILENAME }}
      EP_FILENAME_EXCLUDED: ${{ vars.EP_FILENAME_EXCLUDED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/cron.github.js refresh --minutes=150 --limit=150000
      - run: node scripts/cron.github.js collect --minutes=20
        if: always()
      - run: node scripts/cron.github.js ep
        if: always()
