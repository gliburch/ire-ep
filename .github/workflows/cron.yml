name: cron

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST — refresh
    - cron: "0 11 * * *" # 20:00 KST — refresh
    - cron: "0 5 * * *"  # 14:00 KST — collect
    - cron: "0 17 * * *" # 02:00 KST — collect
  workflow_dispatch:
    inputs:
      task:
        description: 실행할 작업
        type: choice
        default: refresh
        options:
          - refresh
          - collect

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '0 23 * * *' || github.event.schedule == '0 11 * * *'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NODE_ENV: production
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
      MODETOUR_API_KEY: ${{ secrets.MODETOUR_API_KEY }}
      MODETOUR_WEBSITE_NO: ${{ secrets.MODETOUR_WEBSITE_NO }}
      MODETOUR_COMPANY_NO: ${{ secrets.MODETOUR_COMPANY_NO }}
      MODETOUR_DEVICE_TYPE: ${{ secrets.MODETOUR_DEVICE_TYPE }}
      PRODUCT_MASTER_SCRAPE_MONTHS: ${{ vars.PRODUCT_MASTER_SCRAPE_MONTHS }}
      EP_OVERRIDE_SHEET_URL: ${{ secrets.EP_OVERRIDE_SHEET_URL }}
      EP_MAX_ITEMS: ${{ vars.EP_MAX_ITEMS }}
      EP_FILENAME: ${{ vars.EP_FILENAME }}
      EP_FILENAME_EXCLUDED: ${{ vars.EP_FILENAME_EXCLUDED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/cron.github.js refresh --minutes=180 --limit=150000
      - run: node scripts/cron.github.js ep
        if: always()

  collect:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '0 5 * * *' || github.event.schedule == '0 17 * * *'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: production
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB: ${{ secrets.MONGODB_DB }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
      MODETOUR_API_KEY: ${{ secrets.MODETOUR_API_KEY }}
      MODETOUR_WEBSITE_NO: ${{ secrets.MODETOUR_WEBSITE_NO }}
      MODETOUR_COMPANY_NO: ${{ secrets.MODETOUR_COMPANY_NO }}
      MODETOUR_DEVICE_TYPE: ${{ secrets.MODETOUR_DEVICE_TYPE }}
      PRODUCT_MASTER_SCRAPE_MONTHS: ${{ vars.PRODUCT_MASTER_SCRAPE_MONTHS }}
      EP_OVERRIDE_SHEET_URL: ${{ secrets.EP_OVERRIDE_SHEET_URL }}
      EP_MAX_ITEMS: ${{ vars.EP_MAX_ITEMS }}
      EP_FILENAME: ${{ vars.EP_FILENAME }}
      EP_FILENAME_EXCLUDED: ${{ vars.EP_FILENAME_EXCLUDED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/cron.github.js collect --minutes=60
      - run: node scripts/cron.github.js ep
        if: always()
